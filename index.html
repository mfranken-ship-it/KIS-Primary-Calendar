<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }
  #calendar {
    max-width: 900px;
    margin: 0 auto;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
  }
  #calendar .fc,
  #calendar .fc * {
    font-family: Arial, Helvetica, sans-serif;
  }

  /* ── Filter bar ─────────────────────────────────── */
  #class-filter {
    display: none;
    max-width: 900px;
    margin: 0 auto 12px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    font-family: Arial, Helvetica, sans-serif;
  }
  #class-filter .filter-label {
    font-size: 14px;
    color: #5f6368;
    margin-right: 2px;
  }
  #class-filter .sib-label { margin-left: 10px; }
  #class-filter .filter-break {
    flex-basis: 100%;
    height: 0;
  }
  .class-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid transparent;
    border-radius: 16px;
    padding: 5px 14px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: bold;
    color: #fff;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .class-pill[aria-pressed="false"] {
    background-color: #fff !important;
    color: #80868b;
    border-color: #dadce0;
  }
  .class-pill .pill-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background-color: #fff;
  }
  .class-pill[aria-pressed="false"] .pill-dot { background-color: #dadce0; }

  .sib-select {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    padding: 5px 8px;
    border: 1px solid #dadce0;
    border-radius: 16px;
    background-color: #fff;
    color: #202124;
    cursor: pointer;
  }
  .sib-select:disabled {
    color: #b0b3b8;
    background-color: #f5f5f5;
    cursor: default;
  }
  .sib-select.chosen {
    font-weight: bold;
    color: #fff;
    border-color: transparent;
  }

  /* ── Cell structure & alignment ─────────────────── */
  .fc-daygrid-day-frame {
    display: flex;
    flex-direction: column;
    text-align: center;
  }
  .fc-daygrid-day-top {
    display: block !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  .fc-daygrid-day-number {
    display: block !important;
    width: 100%;
    padding: 0 !important;
    margin: 0 !important;
  }
  .fc-daygrid-day-events {
    flex: 1 1 auto;
    text-align: center;
    margin-top: 0 !important;
    padding-top: 0 !important;
  }
  .fc-daygrid-event-harness {
    text-align: center;
    overflow: visible;
  }

  /* ── Date label ─────────────────────────────────── */
  .cell-date {
    width: 100%;
    box-sizing: border-box;
    height: 3em;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 0.03em;
    line-height: 1.25;
    color: #444;
    padding: 4px 0 2px;
  }

  /* ── Today ──────────────────────────────────────────────────────────
     The red highlight is ours: .is-school-today is applied by
     applyTodayHighlight() from the Almaty clock, and re-applied whenever
     the school day rolls over — so it moves without a page reload.

     FullCalendar has its own marker, .fc-day-today, driven by the `now`
     option. `now: schoolToday` is set in the JS config and must STAY —
     without it FullCalendar falls back to the viewer's device clock,
     which is wrong for parents outside Kazakhstan. But it is fixed at
     construction and cannot be updated afterwards (setOption('now', …)
     does not move it), so by the next day it points at a stale cell and
     paints a second, yellow highlight.

     Both rules below suppress that marker. The first clears the colour
     variable; the second is a fallback in case FullCalendar's internals
     change. `:not(.is-school-today)` means neither can ever fight our red
     highlight on the one day where both selectors match.
     ───────────────────────────────────────────────────────────────── */
  #calendar,
  #calendar .fc {
    --fc-today-bg-color: transparent;
  }
  #calendar .fc-day-today:not(.is-school-today) {
    background-color: transparent !important;
  }

  .is-school-today .cell-date { color: #cc0000; }
  .is-school-today { background-color: #ffe6e6 !important; }

  /* ── Day pills ──────────────────────────────────── */
  .fc-event {
    background-color: #7986cb;
    border: none;
    border-radius: 4px;
    padding: 2px 4px;
    text-align: center;
    cursor: default;
    font-size: 16px;
  }
  .fc-event .fc-event-title,
  .fc-event .fc-event-main {
    font-size: 16px;
    font-weight: normal;
  }
  
</head>
<body>

<div id="class-filter"></div>
<div id="calendar"></div>
<div id="toggle-weeks-wrap">
  <button id="toggle-weeks">
    <span class="label">Show 2 more weeks</span>
    <span class="chevron">▾</span>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@6.1.15/index.global.min.js"></script>
<script src="config.js?v=3"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');
    const toggleBtn = document.getElementById('toggle-weeks');
    const filterEl = document.getElementById('class-filter');

    // Colours for added sibling classes, in order of selection
    const SIBLING_COLOURS = ['#E65100', '#0277BD'];

    let manifest = [];        // [{id, label, file}]
    let allGrades = {};       // gradeId -> parsed JSON
    let currentGradeId = null;
    let isolated = null;      // class key in current grade, or null = show all
    let siblings = [];        // [{gradeId, key}] — up to 2

    const pills = {};
    let sibSelects = [];

    // ── Date helpers (anchored to school time, not the device) ──
    const SCHOOL_TZ = 'Asia/Almaty';

    // Test hook: ?now=2026-09-04T11:58 (Almaty wall-clock). Applied as a fixed
    // offset, so the clock still ADVANCES from that point — which is what makes
    // the live transitions testable rather than frozen.
    const nowParam = new URLSearchParams(location.search).get('now');
    const CLOCK_OFFSET = nowParam
      ? (new Date(nowParam + '+05:00').getTime() - Date.now())
      : 0;

    function schoolNow() {
      const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: SCHOOL_TZ,
        weekday: 'short',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', hourCycle: 'h23'
      }).formatToParts(new Date(Date.now() + CLOCK_OFFSET));
      const p = {};
      parts.forEach(function(x) { p[x.type] = x.value; });
      return p;
    }

    const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    // Mutable — recomputed whenever the school clock may have moved on
    let schoolToday, startMonday, baseWeeks;

    function computeSchoolState() {
      const sp = schoolNow();
      const dow = WEEKDAYS.indexOf(sp.weekday);   // 0=Sun .. 6=Sat, in Almaty
      const hour = parseInt(sp.hour, 10);         // 0–23, in Almaty

      const today = new Date(sp.year + '-' + sp.month + '-' + sp.day + 'T00:00:00');

      const thisMonday = new Date(today);
      thisMonday.setDate(today.getDate() + (dow === 0 ? -6 : 1 - dow));

      // Friday from 12:00 Almaty onwards, plus Sat and Sun → drop the current week
      const dropCurrentWeek = (dow === 5 && hour >= 12) || dow === 6 || dow === 0;
      const start = new Date(thisMonday);
      if (dropCurrentWeek) start.setDate(thisMonday.getDate() + 7);

      // Thursday all day, and Friday before 12:00 → 3 rows; otherwise 2
      const weeks = (dow === 4 || (dow === 5 && hour < 12)) ? 3 : 2;

      return { today: today, start: start, weeks: weeks };
    }

    (function () {
      const s = computeSchoolState();
      schoolToday = s.today;
      startMonday = s.start;
      baseWeeks = s.weeks;
    })();

    function rangeFor(weeks) {
      const end = new Date(startMonday);
      end.setDate(startMonday.getDate() + weeks * 7);
      return { start: startMonday, end: end };
    }

    function isoLocal(d) {
      return d.getFullYear() + '-' +
             String(d.getMonth() + 1).padStart(2, '0') + '-' +
             String(d.getDate()).padStart(2, '0');
    }

    function applyTodayHighlight() {
      document.querySelectorAll('.is-school-today').forEach(function (el) {
        el.classList.remove('is-school-today');
      });
      const cell = document.querySelector(
        '.fc-daygrid-day[data-date="' + isoLocal(schoolToday) + '"]'
      );
      if (cell) cell.classList.add('is-school-today');
    }

    // ── Which classes are currently displayed ──────────
    function currentSelections() {
      const out = [];
      const gd = allGrades[currentGradeId];
      if (!gd) return out;

      if (isolated === null) {
        Object.keys(gd.classes).forEach(function(k) {
          out.push({ gradeId: currentGradeId, key: k,
                     label: gd.classes[k].label, colour: gd.classes[k].colour });
        });
      } else {
        out.push({ gradeId: currentGradeId, key: isolated,
                   label: gd.classes[isolated].label,
                   colour: gd.classes[isolated].colour });
        siblings.forEach(function(s, i) {
          const sg = allGrades[s.gradeId];
          if (!sg || !sg.classes[s.key]) return;
          out.push({ gradeId: s.gradeId, key: s.key,
                     label: sg.classes[s.key].label,
                     colour: SIBLING_COLOURS[i] || SIBLING_COLOURS[0] });
        });
      }
      return out;
    }

    // ── Sibling dropdowns ──────────────────────────────
    function populateSibSelects() {
      const lbl = document.getElementById('sib-label');
      if (lbl) lbl.style.display = (isolated === null) ? 'none' : '';
      
      const brk = document.getElementById('filter-break');
      if (brk) brk.style.display = (isolated === null) ? 'none' : '';
      
      sibSelects.forEach(function(sel, idx) {
        // Only show dropdown 2 once dropdown 1 has a choice
        if (idx > 0 && siblings.length < idx) {
          sel.style.display = 'none';
          return;
        }
        sel.style.display = (isolated === null) ? 'none' : '';
        sel.disabled = (isolated === null);

        const chosen = siblings[idx];
        sel.innerHTML = '';

        const none = document.createElement('option');
        none.value = '';
        none.textContent = idx === 0 ? 'Add a class…' : 'Add another…';
        sel.appendChild(none);

        const groups = {};                       // heading -> optgroup element
        manifest.forEach(function(g) {
          const gd = allGrades[g.id];
          if (!gd) return;

          const heading = g.group || g.label;
          let group = groups[heading];
          if (!group) {
            group = document.createElement('optgroup');
            group.label = heading;
            groups[heading] = group;
            sel.appendChild(group);
          }

          Object.keys(gd.classes).forEach(function(k) {
            // exclude the isolated class, and whatever the other dropdown holds
            if (g.id === currentGradeId && k === isolated) return;
            const takenElsewhere = siblings.some(function(s, i) {
              return i !== idx && s.gradeId === g.id && s.key === k;
            });
            if (takenElsewhere) return;

            const opt = document.createElement('option');
            opt.value = g.id + '|' + k;
            opt.textContent = gd.classes[k].label;
            if (chosen && chosen.gradeId === g.id && chosen.key === k) opt.selected = true;
            group.appendChild(opt);
          });
        });

        // remove any heading left with no options
        Object.keys(groups).forEach(function(h) {
          if (!groups[h].children.length) groups[h].remove();
        });

        if (chosen) {
          sel.classList.add('chosen');
          sel.style.backgroundColor = SIBLING_COLOURS[idx];
        } else {
          sel.classList.remove('chosen');
          sel.style.backgroundColor = '';
        }
      });
    }

    function refreshPills() {
      Object.keys(pills).forEach(function(k) {
        const on = (isolated === null) || (isolated === k);
        pills[k].setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }

    function buildFilter() {
      const gd = allGrades[currentGradeId];
      if (!gd) return;
      filterEl.innerHTML = '';

      const label = document.createElement('span');
      label.className = 'filter-label';
      label.textContent = 'Only show:';
      filterEl.appendChild(label);

      Object.keys(gd.classes).forEach(function(key) {
        const cls = gd.classes[key];
        const pill = document.createElement('button');
        pill.className = 'class-pill';
        pill.type = 'button';
        pill.setAttribute('aria-pressed', 'true');
        pill.style.backgroundColor = cls.colour;

        const dot = document.createElement('span');
        dot.className = 'pill-dot';
        const text = document.createElement('span');
        text.textContent = cls.label;
        pill.appendChild(dot);
        pill.appendChild(text);

        pill.addEventListener('click', function() {
          if (isolated === key) {
            isolated = null;
            siblings = [];              // clean reset to default
          } else {
            isolated = key;
            siblings = siblings.filter(function(s) {
              return !(s.gradeId === currentGradeId && s.key === key);
            });
          }
          refreshPills();
          populateSibSelects();
          renderSpecialists();
        });

        pills[key] = pill;
        filterEl.appendChild(pill);
      });

      const brk = document.createElement('span');
      brk.className = 'filter-break';
      brk.id = 'filter-break';
      filterEl.appendChild(brk);

      const sibLabel = document.createElement('span');
      sibLabel.className = 'filter-label sib-label';
      sibLabel.id = 'sib-label';
      sibLabel.textContent = 'Also show:';
      sibLabel.style.display = 'none';
      filterEl.appendChild(sibLabel);

      sibSelects = [];
      for (let i = 0; i < 2; i++) {
        const sel = document.createElement('select');
        sel.className = 'sib-select';
        sel.disabled = true;
        sel.addEventListener('change', function() {
          const idx = sibSelects.indexOf(sel);
          if (!sel.value) {
            siblings.splice(idx, 1);        // cleared → drop it (and any after)
          } else {
            const parts = sel.value.split('|');
            siblings[idx] = { gradeId: parts[0], key: parts[1] };
          }
          populateSibSelects();
          renderSpecialists();
        });
        sibSelects.push(sel);
        filterEl.appendChild(sel);
      }

      populateSibSelects();
      filterEl.style.display = 'flex';
    }

    // ── Specialist rendering ───────────────────────────
    function renderSpecialists() {
      document.querySelectorAll('.specialists').forEach(el => el.remove());
      const selections = currentSelections();
      if (!selections.length) return;

      calendar.getEvents().forEach(function(ev) {
        const match = (ev.title || '').match(/day\s*(\d+)/i);
        if (!match || !ev.start) return;
        const dayNum = match[1];

        const cell = document.querySelector(
          '.fc-daygrid-day[data-date="' + isoLocal(ev.start) + '"] .fc-daygrid-day-events'
        );
        if (!cell) return;

        const wrap = document.createElement('div');
        wrap.className = 'specialists';
        let any = false;

        selections.forEach(function(sel) {
          const gd = allGrades[sel.gradeId];
          if (!gd) return;
          const rota = gd.rotation[dayNum];
          if (!rota) return;
          const subjects = rota[sel.key];
          if (!subjects || !subjects.length) return;

          const row = document.createElement('div');
          row.className = 'spec-row';

          const dot = document.createElement('span');
          dot.className = 'spec-dot';
          dot.style.backgroundColor = sel.colour;

          const text = document.createElement('span');
          text.textContent = sel.label + ': ' + subjects.join(', ');

          row.appendChild(dot);
          row.appendChild(text);
          wrap.appendChild(row);
          any = true;
        });

        if (any) cell.appendChild(wrap);
      });
    }

    // ── Calendar ───────────────────────────────────────
    const calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'weekGrid',
      views: { weekGrid: { type: 'dayGrid' } },
      visibleRange: rangeFor(baseWeeks),
      now: schoolToday, // keeps FullCalendar's clock on Almaty rather than the
                        // device — do not remove. Its own .fc-day-today marker
                        // is suppressed in CSS; see the Today section there.
      firstDay: 1,
      weekends: false,
      dayHeaders: false,
      headerToolbar: false,
      height: 'auto',
      eventDisplay: 'block',
      eventClick: function(info) { info.jsEvent.preventDefault(); },
      eventContent: function(arg) {
        const title = arg.event.title || '';
        const idx = title.indexOf(':');
        const wrap = document.createElement('div');
        if (idx === -1) {
          wrap.textContent = title;
        } else {
          const num = document.createElement('span');
          num.textContent = title.slice(0, idx);
          const desc = document.createElement('span');
          desc.className = 'day-desc';
          desc.textContent = title.slice(idx + 1).trim();
          wrap.appendChild(num);
          wrap.appendChild(desc);
        }
        return { domNodes: [wrap] };
      },
      dayCellContent: function(arg) {
        const weekday = arg.date.toLocaleDateString('en-GB', { weekday: 'short' }).toUpperCase();
        const day = arg.date.getDate();
        const month = arg.date.toLocaleDateString('en-GB', { month: 'short' }).toUpperCase();
        return { html: '<div class="cell-date">' + weekday + ' ' + day + ' ' + month + '</div>' };
      },
        eventsSet: function() { setTimeout(function () {
        renderSpecialists();
        applyTodayHighlight();
      }, 0); },
      googleCalendarApiKey: API_KEY,
      events: { googleCalendarId: CALENDAR_ID }
    });
    calendar.render();
    applyTodayHighlight();

    // ── Keep the calendar in step with the school clock ────────
    function refreshForClock() {
      const s = computeSchoolState();
      const dayChanged = s.today.getTime() !== schoolToday.getTime();
      const rangeChanged = s.start.getTime() !== startMonday.getTime()
                        || s.weeks !== baseWeeks;
      if (!dayChanged && !rangeChanged) return;

      schoolToday = s.today;
      startMonday = s.start;
      baseWeeks = s.weeks;

      if (rangeChanged) {
        // preserve the parent's "show 2 more weeks" choice
        const expanded = toggleBtn.classList.contains('expanded');
        calendar.setOption('visibleRange', rangeFor(baseWeeks + (expanded ? 2 : 0)));
        calendar.refetchEvents();          // eventsSet → renderSpecialists + highlight
         applyTodayHighlight(); 
      } else {
        applyTodayHighlight();
      }
    }

    setInterval(refreshForClock, 60000);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) refreshForClock();
    });
    window.addEventListener('pageshow', refreshForClock);
    window.addEventListener('focus', refreshForClock);
    
    // ── Load data (silent on any failure) ──────────────
    const grade = new URLSearchParams(window.location.search).get('grade');
    if (grade && /^[A-Za-z0-9_-]+$/.test(grade)) {
      currentGradeId = grade;

      fetch('grades.json?v=1')
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(m) {
          manifest = (m && Array.isArray(m.grades)) ? m.grades : [];
          if (!manifest.some(function(g) { return g.id === grade; })) {
            manifest.push({ id: grade, label: 'Grade ' + grade });
          }
          return Promise.all(manifest.map(function(g) {
            const file = g.file || ('grade' + g.id + '.json');
            return fetch(file + '?v=1')
              .then(function(r) { return r.ok ? r.json() : null; })
              .then(function(d) { if (d) allGrades[g.id] = d; })
              .catch(function() { /* skip this grade */ });
          }));
        })
        .then(function() {
          manifest = manifest.filter(function(g) { return allGrades[g.id]; });
          if (!allGrades[currentGradeId]) return;   // current grade missing → plain calendar
          buildFilter();
          renderSpecialists();
        })
        .catch(function() { /* silent */ });
    }

    // ── Toggle ─────────────────────────────────────────
    toggleBtn.addEventListener('click', function() {
      const expanded = toggleBtn.classList.toggle('expanded');
      calendar.setOption('visibleRange', rangeFor(baseWeeks + (expanded ? 2 : 0)));
      calendar.refetchEvents();
      toggleBtn.querySelector('.label').textContent =
        expanded ? 'Show fewer weeks' : 'Show 2 more weeks';
    });
  });
</script>
<script>
  window.goatcounter = {
    endpoint: 'https://edu-assets.maartens-airquality.nl/assets/c',
    allow_frame: true,
    path: function () {
      var g = (new URLSearchParams(location.search).get('grade') || '').toLowerCase();
      return '/weekly-update/' + (/^[a-z0-9-]{1,12}$/.test(g) ? g : 'unknown');
    },
    title: 'Weekly update calendar'
  };
</script>
<script async src="gc.js"></script>
</body>
</html>
