<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: Arial, sans-serif; }
  #calendar { max-width: 900px; margin: 0 auto; }

  .cell-date {
    text-align: center;
    font-size: 0.75em;
    font-weight: bold;
    letter-spacing: 0.03em;
    color: #444;
    padding: 6px 0 2px;
  }

  .fc-day-today .cell-date { color: #1a73e8; }
  .fc-day-today { background-color: #eaf1fd !important; }

  .fc-event {
    background-color: #7986cb;
    border: none;
    border-radius: 4px;
    padding: 2px 4px;
    text-align: center;
  }

  /* Toggle link */
  #toggle-weeks-wrap {
    text-align: center;
    margin-top: 10px;
  }
  #toggle-weeks {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: none;
    background: none;
    color: #3f51b5;
    font-size: 0.85em;
    font-weight: bold;
    letter-spacing: 0.02em;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 4px;
    transition: background-color 0.15s ease;
  }
  #toggle-weeks:hover {
    background-color: #eef0fb;
  }
  #toggle-weeks .chevron {
    display: inline-block;
    transition: transform 0.2s ease;
  }
  #toggle-weeks.expanded .chevron {
    transform: rotate(180deg);
  }
</style>
</head>
<body>

<div id="calendar"></div>
<div id="toggle-weeks-wrap">
  <button id="toggle-weeks">
    <span class="label">Show 2 more weeks</span>
    <span class="chevron">▾</span>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@6.1.15/index.global.min.js"></script>
<script>
  // ── Config ──────────────────────────────────────────
  const API_KEY = 'AIzaSyAIUj3e_xOfu-z8TvBSTAtbWTOcWlvxwc8';
  const CALENDAR_ID = 'c_51642eb914ce9f3dfeb13a9c07b9d7cc7e2dc6478e6d63d0d7fe9edfd18b9b3c@group.calendar.google.com';
  // ────────────────────────────────────────────────────

  document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');
    const toggleBtn = document.getElementById('toggle-weeks');

    // Monday of the current week
    const today = new Date();
    const dow = today.getDay(); // 0=Sun..6=Sat
    const diffToMonday = dow === 0 ? -6 : 1 - dow;
    const monday = new Date(today);
    monday.setDate(today.getDate() + diffToMonday);

    // Base weeks: 2 normally, 3 on Thursday or Friday
    const baseWeeks = (dow === 4 || dow === 5) ? 3 : 2;
    let extraWeeks = 0;

    const calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'weekGrid',
      views: {
        weekGrid: { type: 'dayGrid', duration: { weeks: baseWeeks } }
      },
      initialDate: monday,
      firstDay: 1,
      weekends: false,
      dayHeaders: false,
      headerToolbar: false,
      height: 'auto',
      eventDisplay: 'block',
      dayCellContent: function(arg) {
        const weekday = arg.date.toLocaleDateString('en-GB', { weekday: 'short' }).toUpperCase();
        const day = arg.date.getDate();
        const month = arg.date.toLocaleDateString('en-GB', { month: 'short' }).toUpperCase();
        return { html: `<div class="cell-date">${weekday} ${day} ${month}</div>` };
      },
      googleCalendarApiKey: API_KEY,
      events: { googleCalendarId: CALENDAR_ID }
    });
    calendar.render();

    toggleBtn.addEventListener('click', function() {
      const expanded = toggleBtn.classList.toggle('expanded');
      extraWeeks = expanded ? 2 : 0;
      calendar.setOption('duration', { weeks: baseWeeks + extraWeeks });
      toggleBtn.querySelector('.label').textContent = expanded
        ? 'Show fewer weeks'
        : 'Show 2 more weeks';
    });
  });
</script>
</body>
</html>
