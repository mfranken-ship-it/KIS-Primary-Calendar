<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: Arial, sans-serif; }
  #calendar { max-width: 700px; margin: 0 auto; }
</style>
</head>
<body>
<div id="calendar"></div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js" data-plugin="google-calendar"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@6.1.15/index.global.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');
    const calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'listTwoWeeks',
      views: {
        listTwoWeeks: {
          type: 'list',
          duration: { days: 14 }
        }
      },
      headerToolbar: false,
      height: 'auto',
      googleCalendarApiKey: 'YOUR_API_KEY_HERE',
      events: {
        googleCalendarId: 'YOUR_CALENDAR_ID_HERE'
      }
    });
    calendar.render();
  });
</script>
</body>
</html>
